; php-fpm pool. The master process already runs as an unprivileged user inside an
; unprivileged container, so no setuid/setgid happens here: the pool stays as-is
; and the container needs no capabilities at all.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = nobody
group = nobody
listen = 127.0.0.1:9000
listen.owner = nobody
listen.group = nobody
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
access.log = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
