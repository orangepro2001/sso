; SSO PHP runtime settings.
; Production values: no debug, no code reloading on every request, sane limits.

expose_php = Off
memory_limit = 256M
max_execution_time = 30
post_max_size = 2M
upload_max_filesize = 2M

date.timezone = UTC

; The console is small; a handful of PHP-FPM workers is plenty for internal use.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Errors go to stderr (journald through the container log driver).
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

session.cookie_httponly = 1
