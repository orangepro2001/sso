user  nobody;
worker_processes  auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No access log: caddy already logs, and duplicated logs are just noise.
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 512;

    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        # Binds every interface by design: the service is reachable directly and
        # through the reverse proxy that mounts it at /sso.
        listen 0.0.0.0:3550;
        server_name _;

        root /app/public;
        index index.php;

        charset utf-8;

        # Absolute paths only: the proxy strips /sso before forwarding.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 30;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Never serve dotfiles or the framework's own directories.
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
