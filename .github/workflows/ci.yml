name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  test:
    name: tests (PHP + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sso_test
          POSTGRES_USER: sso
          POSTGRES_PASSWORD: sso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sso -d sso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, openssl, mbstring, intl, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: sso_test
          DB_USERNAME: sso
          DB_PASSWORD: sso
          DB_SSLMODE: prefer

  image:
    name: image (podman build + smoke)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          podman build --format docker \
            -f deploy/Containerfile \
            --build-arg VERSION=${GITHUB_SHA::7} \
            -t localhost/sso:ci .

      - name: Smoke test the image against PostgreSQL
        run: |
          podman network create sso-ci
          podman run -d --name sso-pg --network sso-ci \
            -e POSTGRES_DB=sso -e POSTGRES_USER=sso -e POSTGRES_PASSWORD=sso \
            docker.io/library/postgres:18-alpine
          for i in $(seq 1 30); do
            podman exec sso-pg pg_isready -U sso -d sso && break || sleep 1
          done

          APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"

          podman run -d --name sso-ci --network sso-ci --read-only \
            --tmpfs /tmp:rw,mode=1777 \
            --tmpfs /app/storage:rw,mode=1777 \
            --tmpfs /app/bootstrap/cache:rw,mode=1777 \
            --cap-drop all --security-opt no-new-privileges \
            -e APP_KEY="$APP_KEY" \
            -e APP_URL=http://127.0.0.1:3550 \
            -e SSO_ISSUER=http://127.0.0.1:3550/sso \
            -e SSO_URL_SCHEME=http \
            -e SESSION_PATH=/ \
            -e SESSION_SECURE_COOKIE=false \
            -e DB_CONNECTION=pgsql -e DB_HOST=sso-pg -e DB_PORT=5432 \
            -e DB_DATABASE=sso -e DB_USERNAME=sso -e DB_PASSWORD=sso -e DB_SSLMODE=prefer \
            -e SSO_GUEST_SECRET=ci-guest-secret-0123456789 \
            -e SSO_BOOTSTRAP_ADMIN_EMAIL=ci@example.com \
            -e SSO_BOOTSTRAP_ADMIN_PASSWORD=bootstrap-password-1 \
            localhost/sso:ci

          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3550/healthz && break || sleep 1
          done

          echo "--- discovery ---"
          curl -fsS http://127.0.0.1:3550/.well-known/openid-configuration \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["issuer"].endswith("/sso"), d; print("issuer:", d["issuer"])'

          echo "--- jwks ---"
          curl -fsS http://127.0.0.1:3550/.well-known/jwks.json \
            | python3 -c 'import json,sys; k=json.load(sys.stdin)["keys"]; assert k and k[0]["alg"]=="RS256", k; print("kid:", k[0]["kid"])'

          echo "--- guest channel ---"
          DEVICE="ci-runner-$RANDOM"
          SIG=$(printf 'sso-guest-v1\n%s' "$DEVICE" | openssl dgst -sha256 -hmac "ci-guest-secret-0123456789" -r | cut -d' ' -f1)
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:3550/oauth/guest \
            -H 'Content-Type: application/json' \
            -d "{\"device_id\":\"$DEVICE\",\"signature\":\"$SIG\"}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["signature_valid"] is True, d; print(d["access_token"])')

          echo "--- guest token resolves ---"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3550/oauth/userinfo \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["subject_type"]=="guest", d; print("guest ok:", d["device_id"])'

          echo "--- console ---"
          curl -fsS -o /dev/null -w 'admin login: %{http_code}\n' http://127.0.0.1:3550/admin/login
          curl -fsS -o /dev/null -w 'stylesheet: %{http_code}\n' http://127.0.0.1:3550/assets/app.css

          podman healthcheck run sso-ci

      - name: Logs on failure
        if: failure()
        run: |
          podman logs sso-ci || true
          podman logs sso-pg || true
